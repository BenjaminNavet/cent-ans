# cargo-nextest configuration of the Bevy client (its own workspace: this file is read from client/).
# Run: `cd client && cargo nextest run --features dev` (or `tests/test.sh`, which falls back to
# `cargo test` when nextest is missing). `cargo test --features dev` keeps working unchanged.

[profile.default]
# A stuck test (event loop, deadlock) must not hold an agent: warn after 60 s, kill after 3 periods.
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
# Shader / data tests are CPU-heavy: leave the machine usable for parallel worktrees.
test-threads = "num-cpus"
status-level = "fail"
final-status-level = "fail"

# Filtered-out flaky candidates: tests that open the GPU or the background window get one retry.
[[profile.default.overrides]]
filter = "binary(smoke) or binary(audio_playback)"
retries = 1
slow-timeout = { period = "120s", terminate-after = 5 }

# CI: retries for flaky smoke-like tests, JUnit report for the workflow summary.
[profile.ci]
inherits = "default"
retries = 2
fail-fast = false
status-level = "retry"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# Smoke scenarios (`--run-ignored only`): ~4 min, one retry, long timeout.
[profile.smoke]
inherits = "default"
retries = 1
slow-timeout = { period = "300s", terminate-after = 3 }
