[package]
name = "cent-ans"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bevy client of Cent Ans (ADR 0357): rendering, UI and input only, every rule lives in core/."

# Standalone workspace: kept out of core/ (separate build and target/, ADR 0357).
[workspace]

[lib]
name = "cent_ans_client"
path = "src/lib.rs"

[[bin]]
name = "cent-ans"
path = "src/main.rs"

[features]
# Fast iterations: Bevy dynamic linking. The player binary is linked statically.
dev = ["bevy/dynamic_linking", "bevy/file_watcher", "bevy/debug", "remote", "dep:bevy_brp_extras", "dep:bevy_egui", "dep:bevy_console", "dep:clap"]
# Bevy Remote Protocol (HTTP, localhost) for live inspection by agents.
remote = ["bevy/bevy_remote"]
# Per-system timings (bevy_ecs tracing spans + our own subscriber layer, no Chrome/Tracy crate):
# adds a "systems" section to the `--bench-map` report. See tools/bevy_bench/README.md.
profile = ["dep:ecs_trace", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Renamed: Bevy derive macros would otherwise resolve `bevy_ecs` as a direct dependency.
ecs_trace = { package = "bevy_ecs", version = "=0.20.0", optional = true, features = ["trace", "debug"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
bevy = { version = "=0.20.0", features = ["jpeg", "png", "webp", "mp3", "wav"] }
data-model = { path = "../core/crates/data-model" }
sim-campaign = { path = "../core/crates/sim-campaign" }
sim-battle = { path = "../core/crates/sim-battle" }
ai = { path = "../core/crates/ai" }
game-api = { path = "../core/crates/game-api" }
relief-lod = { path = "../core/crates/relief-lod" }
vegetation = { path = "../core/crates/vegetation" }
# Dev-only tools (ADR 0364): never linked into release builds (feature `dev` only).
bevy_brp_extras = { version = "=0.23.0", optional = true }
bevy_egui = { version = "=0.43.1", optional = true, default-features = false, features = ["render", "default_fonts"] }
bevy_console = { version = "=0.19.0", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
png = "0.18"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
bevy_common_assets = { version = "0.18", default-features = false, features = ["json"] }
bevy_asset_loader = { version = "0.28.1", default-features = false, features = [] }

[dev-dependencies]
wesl = "0.6"
naga = { version = "30", features = ["wgsl-in"] }
# Snapshot tests of the agent dumps (tests/snapshots.rs); `cargo insta review` to accept.
insta = { version = "1", features = ["json", "yaml", "redactions", "filters"] }

[profile.dev]
opt-level = 1
# Line tables only: file:line backtraces and profiles stay, the 29-32 GB per worktree shrink (ADR 0365).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
