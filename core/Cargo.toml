[workspace]
resolver = "2"
members = [
    "crates/data-model",
    "crates/sim-campaign",
    "crates/sim-battle",
    "crates/ai",
    "crates/godot-bridge",
    "crates/vegetation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# EP13 (ADR 0072): exact float parsing, so a replay file (and a save) reads back the very
# numbers it wrote; hand-written data (short decimals) parses the same either way.
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"

# PNG decoding (4096x4096 16-bit heightmap) must stay well under 500 ms even in
# debug builds: optimise only the decoding crates, never our own code.
# Lot M2: the data crate walks 4096² rasters (province ids, land mask) once
# per process; optimise it too so that tests stay fast.
# Hot simulation crates are optimised even in dev: the debug dylib loaded by
# `godot --path game` was ~50x slower at end of turn than release (audit A5, T1).
[profile.dev.package.sim-campaign]
opt-level = 2
[profile.dev.package.sim-battle]
opt-level = 2
[profile.dev.package.ai]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.data-model]
opt-level = 3
# Lot PB2: vegetation tile scattering (millions of scalar operations per tile).
[profile.dev.package.vegetation]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
