[workspace]
resolver = "2"
members = [
    "crates/data-model",
    "crates/sim-campaign",
    "crates/sim-battle",
    "crates/ai",
    "crates/godot-bridge",
    "crates/vegetation",
    "crates/relief-lod",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
# LTO thin (fat : 32 min de build contre 10, ADR 0079), une unité de compilation par crate. Pas de panic=abort :
# gdext attrape les panics à la frontière FFI. Pas de target-cpu (baseline M1 : un CPU plus récent planterait sur M1-M3).
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# PB3a : profil optionnel pour des mesures locales uniquement (jamais pour l'export
# joueur). Compiler avec `RUSTFLAGS="-C target-cpu=native" cargo build --profile
# bench-native -p ai --example turn_perf` exploite les instructions du CPU de la machine
# de développement (ex. Apple M4) ; à réserver aux comparaisons A/B sur cette machine.
[profile.bench-native]
inherits = "release"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# EP13 (ADR 0072): exact float parsing, so a replay file (and a save) reads back the very
# numbers it wrote; hand-written data (short decimals) parses the same either way.
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
# PB3f (ADR 0091): the AI planner's read-only work on the performance cores.
rayon = "1"

# ADR 0084: parallel agent sessions each leave their own incremental cache
# (29 GB of target/debug/incremental on 2026-09-26); rebuild from scratch instead.
[profile.dev]
incremental = false

# Debug builds: dependencies (PNG decoding of 4096² rasters...) are optimised, hot crates too.
# Lot M2: the data crate walks 4096² rasters (province ids, land mask) once
# per process; optimise it too so that tests stay fast.
# Hot simulation crates are optimised even in dev: the debug dylib loaded by
# `godot --path game` was ~50x slower at end of turn than release (audit A5, T1).
[profile.dev.package.sim-campaign]
opt-level = 2
[profile.dev.package.sim-battle]
opt-level = 2
[profile.dev.package.ai]
opt-level = 2
# PB3a : le pont Godot construit des Dictionary/Array et boucle sur les figurines chaque
# image (get_units, get_soldier_buffers...) ; en dev sans opt-level explicite il hérite
# du profil `dev` global (opt-level 0) car les crates du workspace ne sont pas couvertes
# par `[profile.dev.package."*"]` (qui ne vise que les dépendances externes).
[profile.dev.package.godot-bridge]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.data-model]
opt-level = 3
# Lot PB2: vegetation tile scattering (millions of scalar operations per tile).
[profile.dev.package.vegetation]
opt-level = 3
# Lot PB3g: relief quadtree selection (every frame while the camera moves).
[profile.dev.package.relief-lod]
opt-level = 3
