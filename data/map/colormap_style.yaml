# Carte de couleur du sol de campagne (chantier SS, ADR 0142).
# Lue par `cent-ans geo colormap` (tools/cent_ans_tools/geo/colormap.py), validée par
# data/schemas/colormap_style.schema.json. Couleurs sRGB « #rrggbb ». Toute retouche de
# palette se fait ici puis re-cuisson ; aucune couleur dans le code ni dans le shader.
# Cible : vue satellite façon Total War (Attila / Pharaoh), saison moyenne (fin de printemps).

seed: 1341
# Texels de la carte de couleur par pixel de carte (7168 x 6144 -> 14336 x 12288, ~360 m/texel).
scale: 2

palette:
  sea_deep: "#1d3848"
  sea_shallow: "#2e5d66"
  grassland: "#5c8038"
  grassland_dry: "#9c9443"
  farmland: "#998552"
  farmland_dry: "#b59a4f"
  forest_broadleaf: "#293d1c"
  forest_conifer: "#1f301f"
  heath: "#85744a"
  rock: "#8b8272"
  snow: "#e9edf0"
  coast_sand: "#d2bf8c"
  marsh: "#4e6334"
  ponds: "#3b5a4e"
  wet_meadow: "#4f7d34"
  road: "#8c7a5c"
  lake_deep: "#24505e"
  lake_shallow: "#4f8279"
  lake_shore: "#bfae84"
  reeds: "#77843e"
  town_ground: "#9a6b4b"
  town_gardens: "#5d7c2c"
  # VIS-R3a : noyaux villageois (jardins clairs, vergers plus sombres, cour de terre chaude).
  village_garden: "#6f8a3a"
  orchard: "#4f6f30"
  village_core: "#a07a58"
  hedge: "#2f4420"
  # Garrigue / maquis (biomes méditerranéen et semi-aride, HB) : sombre et clair, en taches.
  scrub: "#6e7446"
  scrub_light: "#a39a6a"
  # Cultures irriguées et palmeraies des vallées des biomes secs.
  oasis: "#5c9a30"  # CS2 : vert foncé de cultures irriguées (Nil, Tigre)

# Base régionale.
base:
  # Sécheresse : 0 au nord de dry_lat_start, 1 au sud de dry_lat_full (+ steppes et zone aride
  # de landcover.dryness). Les couleurs *_dry s'y substituent.
  dry_lat_start: 47.0
  dry_lat_full: 38.5
  # Variation d'humidité (bruit basse fréquence) ajoutée à la sécheresse.
  moisture_noise_km: 90.0
  moisture_noise_amp: 0.35
  # Bruit de luminosité contre l'aplat.
  brightness_noise_km: 35.0
  brightness_noise_amp: 0.16
  # Roche plutôt que lande au-dessus de cette altitude (fondu en mètres).
  rock_from_m: 1700.0
  rock_full_m: 2700.0
  # Neige persistante : sommets et crêtes hautes seulement (tiers supérieur des Alpes, taches
  # aux Pyrénées / Taurus / Atlas) ; roche grise en dessous (lot C2b).
  snow_from_m: 3050.0
  snow_full_m: 3400.0
  # Intensité des zones humides (wetlands.png R marais, G étangs, B prés humides).
  wetland_strength: [0.75, 0.8, 0.55]
  # Sable côtier (mer seulement) : largeur, altitude max et part des côtes (bruit).
  coast_sand_width_m: 900.0
  coast_sand_max_height_m: 25.0
  coast_sand_share: 0.55
  coast_sand_noise_km: 25.0
  # Mer : du clair (côte) au sombre (large).
  sea_shallow_width_m: 12000.0

# Mosaïque agricole (blocs Voronoï déformés, lanières d'openfield, bocage).
mosaic:
  block_size_m: 2200.0
  # Déformation des bords de blocs (part de la taille de bloc) et échelle du bruit.
  warp_share: 0.5
  warp_cells: 2.5
  # Lot CC CS (« tapis moucheté » de près) : couleurs de cultures rapprochées de leur moyenne
  # (1 : telles quelles), assolement (une part des blocs suit la culture de la zone de `sole_km`),
  # grain de luminosité à l'intérieur des blocs (cellules de `grain_m`).
  # VIS-R3a : contraste relevé (0,55 -> 0,85) pour que la hiérarchie de valeur forêt < pré < labour < chaume survive.
  crop_contrast: 0.85
  pasture_contrast: 0.75
  sole_km: 14.0
  sole_share: 0.7
  # Mise en culture groupée (clairières, finages) : part du tirage qui suit un champ de `cluster_km`.
  cluster: 0.6
  cluster_km: 7.0
  grain: 0.07
  grain_m: 1200.0
  # Openfield en lanières au nord : allongement des blocs et latitude d'apparition.
  strip_ratio: 2.6
  openfield_lat_from: 46.5
  openfield_lat_full: 48.5
  strip_orientation_km: 60.0
  # Densité : part cultivée = (gain_farmland * cultures + gain_grassland * prairie) x proximité.
  gain_farmland: 1.9
  gain_grassland: 0.8
  # Proximité des colonies : far_share loin de tout, 1 à côté (décroissance en km).
  settlement_decay_km: 6.0
  far_share: 0.45
  # Jamais sur roche, neige, eau, forêt dense, marais (seuils de part).
  max_rock: 0.45
  max_forest: 0.55
  max_marsh: 0.5
  opacity: 0.9
  # Variation de luminosité d'un bloc à l'autre.
  block_jitter: 0.07
  # Bocage : haies sombres aux bords de blocs là où la prairie domine.
  hedge_strength: 0.25
  hedge_grass_from: 0.5
  hedge_grass_full: 0.75
  # Teinte dorée des cultures au sud (x sécheresse).
  dry_crop_tint: "#c9a654"
  dry_crop_amount: 0.35
  crops:
    - {name: ble, color: "#b89c57", weight: 0.26}
    - {name: orge, color: "#a89a5c", weight: 0.16}
    - {name: seigle_avoine, color: "#998f54", weight: 0.1}
    - {name: jachere, color: "#9a7b55", weight: 0.16}
    - {name: labour, color: "#a38059", weight: 0.14}
    - {name: pre, color: "#568035", weight: 0.18}
  pastures:
    - {name: pre, color: "#568035", weight: 0.45}
    - {name: pature, color: "#668738", weight: 0.35}
    - {name: pre_fauche, color: "#759247", weight: 0.2}
  vine:
    color: "#5b5a2c"
    # Pente minimale (m/m sur la grille de 719 m), exposition sud minimale (0-1), latitude max.
    min_slope: 0.02
    min_south: 0.35
    max_lat: 49.6
    share: 0.65

# Routes (roads.geojson, coordonnées en pixels de carte), terre claire.
roads:
  opacity: 0.85
  # Adoucissement du bord (texels).
  soft_px: 0.6
  types:
    main: {width_m: 14.0, min_px: 1.5}
    secondary: {width_m: 8.0, min_px: 1.1}
    computed: {width_m: 6.0, min_px: 1.0}

# Lacs : eau intérieure de land_mask.png non connectée au bord de la carte.
lakes:
  # Au-delà de cette surface (pixels de carte), l'eau est une mer (mer Noire, Caspienne).
  max_area_px: 60000
  shore_width_m: 420.0
  reeds_width_m: 520.0
  reeds_share: 0.7
  reeds_noise_km: 6.0
  shallow_width_m: 1800.0

# Auréoles de villes (towns_1340.json) : sol battu dans l'emprise bâtie, jardins autour.
towns:
  # Rayon de l'emprise = sqrt(built_ha / pi) ; auréole de jardins = garden_factor x ce rayon.
  ground_min_px: 0.8
  ground_opacity: 0.75
  garden_factor: 2.4
  garden_opacity: 0.45

# Noyaux villageois (VIS-R3a) : autour de chaque lieu indexé (data/map/settlements_px.json et
# hamlets.json, ~3 900), une cour de terre chaude, puis une couronne de jardins clairs et de
# vergers plus sombres (`orchard_share` des texels), qui s'éclaircit avec la distance.
villages:
  min_core_px: 0.7
  core_m: 450.0
  ring_m: 1500.0
  core_opacity: 0.6
  ring_opacity: 0.55
  orchard_share: 0.4

# Biomes (chantier HB, ADR 0143) : data/map/biomes.png (légende data/map/biomes.yaml).
# Chaque classe surcharge une partie de la palette des terres et module la mosaïque ; les
# poids des biomes sont fondus sur transition_km (pas de frontière nette). Paramètres :
#   palette        couleurs remplaçant celles de la palette globale (terres seulement)
#   dry_max        plafond de la sécheresse venue de la latitude (les zones arides et steppes
#                  de landcover.dryness gardent leur poids : Sahara, steppe pontique)
#   forest_keep    part des forêts de splat.png conservée (le reste s'ouvre en herbe ou en
#                  garrigue) ; les forêts restent entières à moins de valley_km d'une rivière
#   conifer_min    part minimale de résineux dans les forêts
#   scrub          part de garrigue / maquis sur les terres non cultivées (herbe, lande)
#   presence       multiplicateur de la probabilité qu'un bloc soit cultivé
#   pasture_shift  ajout à la part de prés parmi les blocs cultivés
#   bocage, openfield, vine  multiplicateurs des haies, lanières et vignes
#   crops, pastures          listes remplaçant celles de la mosaïque (blocs de ce biome)
biomes:
  transition_km: 25.0
  # Pixels de carte par cellule de la grille des poids (fondu de dizaines de km).
  weight_step: 4
  scrub_noise_km: 6.0
  scrub_patchiness: 0.35
  valley_km: 4.0
  # Lot CC CS : bande verte (palette `oasis`) le long des rivières permanentes des biomes secs
  # (vallée du Nil, Mésopotamie, oueds) : demi-largeur pleine = valley_green_km x 0,35, fondue jusqu'à valley_green_km.
  valley_green_km: 9.0
  # CS2 : part de valley_green_km où la bande est pleine (bande franche, fondu court).
  valley_green_core: 0.65
  classes:
    # Bocage vert vif, prés, haies.
    oceanic:
      palette:
        grassland: "#4f8f2a"
        grassland_dry: "#789a3a"
        farmland: "#7e8a38"
        farmland_dry: "#a39a4a"
        forest_broadleaf: "#264a1a"
      presence: 1.0
      pasture_shift: 0.3
      bocage: 1.8
      openfield: 0.25
      vine: 0.3
      pastures:
        - {name: pre, color: "#4a7f30", weight: 0.5}
        - {name: pature, color: "#5b8736", weight: 0.3}
        - {name: pre_fauche, color: "#6f9142", weight: 0.2}
    # Openfield doré / brun, forêts de feuillus.
    continental:
      palette:
        grassland: "#6b8a34"
        farmland: "#a8913f"
        farmland_dry: "#b89a52"
        forest_broadleaf: "#2e4a1e"
      presence: 1.05
      pasture_shift: -0.15
      bocage: 0.35
      openfield: 1.3
      crops:
        - {name: ble, color: "#bf9f55", weight: 0.28}
        - {name: orge, color: "#ad9d5c", weight: 0.16}
        - {name: seigle_avoine, color: "#9d9154", weight: 0.12}
        - {name: jachere, color: "#9f7e57", weight: 0.16}
        - {name: labour, color: "#a98459", weight: 0.16}
        - {name: pre, color: "#5c8038", weight: 0.12}
    # Sols ocre / rouges, oliveraies gris-vert, vigne ; garrigue et maquis bas dominants
    # hors cultures, pas de futaie dense de feuillus (chênes verts et pins d'Alep épars).
    mediterranean:
      palette:
        grassland: "#7a8a3e"
        grassland_dry: "#9c9452"
        farmland: "#a8834a"
        farmland_dry: "#b98a55"
        forest_broadleaf: "#3f5230"
        forest_conifer: "#34482a"
        heath: "#8a7a50"
        scrub: "#56663a"
        scrub_light: "#86885a"
      dry_max: 0.35
      forest_keep: 0.35
      scrub: 0.7
      presence: 0.8
      pasture_shift: -0.3
      bocage: 0.1
      openfield: 0.2
      vine: 1.8
      crops:
        - {name: ble, color: "#c9a24a", weight: 0.2}
        - {name: orge, color: "#bfa35c", weight: 0.12}
        - {name: olivier, color: "#7a8260", weight: 0.26}
        - {name: vigne, color: "#6a6634", weight: 0.08}
        - {name: jachere, color: "#b0794d", weight: 0.14}
        - {name: labour, color: "#b0704a", weight: 0.14}
        - {name: potager, color: "#7f8a44", weight: 0.06}
      pastures:
        - {name: pature_seche, color: "#a39a58", weight: 0.6}
        - {name: pre, color: "#7f8a44", weight: 0.4}
    # Herbe dorée / paille, quasi sans arbres (hors vallées), peu de champs.
    steppe:
      palette:
        grassland: "#9a9a48"
        grassland_dry: "#b0a455"
        farmland: "#aa9a4c"
        farmland_dry: "#c4a860"
        forest_broadleaf: "#3c5226"
        heath: "#8f8c50"
      forest_keep: 0.08
      presence: 0.3
      pasture_shift: 0.4
      bocage: 0.0
      openfield: 0.1
      vine: 0.2
      crops:
        - {name: ble, color: "#cfa84a", weight: 0.4}
        - {name: millet, color: "#b99c52", weight: 0.3}
        - {name: jachere, color: "#9c8452", weight: 0.3}
      pastures:
        - {name: herbe, color: "#8f944c", weight: 0.5}
        - {name: stipa, color: "#b4ab6c", weight: 0.3}
        - {name: pature, color: "#7f8c44", weight: 0.2}
    # Conifères sombres, tourbières, clairières, peu de champs.
    boreal:
      palette:
        grassland: "#5f843a"
        grassland_dry: "#7f8e46"
        farmland: "#928d3f"
        forest_broadleaf: "#2e4524"
        forest_conifer: "#17301c"
        heath: "#6a6546"
      conifer_min: 0.75
      presence: 0.35
      pasture_shift: 0.2
      bocage: 0.1
      openfield: 0.2
      vine: 0.0
      crops:
        - {name: seigle, color: "#a39a4a", weight: 0.35}
        - {name: orge, color: "#b0a456", weight: 0.25}
        - {name: avoine, color: "#9c9a50", weight: 0.15}
        - {name: jachere, color: "#9a7c55", weight: 0.15}
        - {name: essart, color: "#a08058", weight: 0.1}
    # Alpages verts, forêts de sapins, roche au-dessus (base.rock_from_m).
    mountain:
      palette:
        grassland: "#5d8f36"
        grassland_dry: "#869a48"
        heath: "#6f8a42"
        farmland: "#8a8a44"
        forest_broadleaf: "#294420"
        forest_conifer: "#1c3820"
      dry_max: 0.6
      conifer_min: 0.65
      presence: 0.5
      pasture_shift: 0.45
      bocage: 0.3
      openfield: 0.0
      vine: 0.6
      pastures:
        - {name: alpage, color: "#4f7f30", weight: 0.5}
        - {name: pre_fauche, color: "#6b8f40", weight: 0.3}
        - {name: pature, color: "#5a8436", weight: 0.2}
    # Terre ocre-rose, maigres cultures, maquis clair.
    semi_arid:
      palette:
        grassland: "#a89a62"
        grassland_dry: "#caa87a"
        farmland: "#b88f62"
        farmland_dry: "#c69a6c"
        forest_broadleaf: "#5a6040"
        forest_conifer: "#4a5636"
        heath: "#b09070"
        scrub: "#8a8a5c"
        scrub_light: "#b8a47c"
      dry_max: 0.5
      valley_green: 0.95
      forest_keep: 0.25
      scrub: 0.45
      presence: 0.5
      pasture_shift: -0.2
      bocage: 0.0
      openfield: 0.1
      vine: 0.8
      crops:
        - {name: ble, color: "#c8a452", weight: 0.3}
        - {name: orge, color: "#c0a868", weight: 0.25}
        - {name: jachere, color: "#c49474", weight: 0.25}
        - {name: olivier, color: "#8a8c66", weight: 0.1}
        - {name: labour, color: "#9a6a4c", weight: 0.1}
      pastures:
        - {name: parcours, color: "#b4a070", weight: 0.7}
        - {name: pre, color: "#8e8c52", weight: 0.3}
    # Sous-classes régionales 8-14 (ADR 0242) : palette du parent légèrement adaptée. Une classe
    # sans entrée ici prend celle de son parent (colormap.biome_weights).
    # Sable ocre clair, quasi sans végétation ni champs (oasis rares).
    desert:
      palette:
        grassland: "#b4a578"
        grassland_dry: "#d2b886"
        farmland: "#c19a66"
        farmland_dry: "#cfa874"
        forest_broadleaf: "#6a6c46"
        forest_conifer: "#586240"
        heath: "#bea17c"
        scrub: "#94905f"
        scrub_light: "#c4b185"
      dry_max: 0.8
      valley_green: 0.95
      forest_keep: 0.05
      scrub: 0.3
      presence: 0.05
      pasture_shift: -0.3
      bocage: 0.0
      openfield: 0.05
      vine: 0.1
      crops:
        - {name: palmeraie, color: "#7c8a4a", weight: 0.4}
        - {name: orge, color: "#c0a868", weight: 0.3}
        - {name: jachere, color: "#c49474", weight: 0.3}
      pastures:
        - {name: parcours, color: "#c0ab7a", weight: 1.0}
    # Lichens gris-vert, mousses, taïga clairsemée, aucun champ.
    tundra:
      palette:
        grassland: "#6f7f58"
        grassland_dry: "#8a8d6a"
        farmland: "#8a8a5a"
        forest_broadleaf: "#4a5a3a"
        forest_conifer: "#2c4030"
        heath: "#7a7a5c"
      forest_keep: 0.15
      conifer_min: 0.7
      presence: 0.05
      pasture_shift: 0.4
      bocage: 0.0
      openfield: 0.0
      vine: 0.0
    # Openfield doré, bosquets de chênes et de bouleaux dans la forêt-steppe.
    continental_east:
      palette:
        # RX restes : un peu plus vert et doré (l'Oural sortait en brun-olive terne).
        grassland: "#6f9a36"
        grassland_dry: "#a2a244"
        farmland: "#bba444"
        forest_broadleaf: "#34502a"
      presence: 1.0
      pasture_shift: -0.1
      bocage: 0.15
      openfield: 1.5
      vine: 0.1
    # Bocage verdoyant, pins maritimes, landes.
    atlantic_south:
      palette:
        grassland: "#5a9030"
        grassland_dry: "#82983e"
        farmland: "#84903c"
        forest_conifer: "#2a4a26"
        heath: "#7a7a48"
      conifer_min: 0.3
      presence: 0.9
      pasture_shift: 0.25
      bocage: 1.5
      openfield: 0.2
      vine: 0.8
    # Grande plaine de blé et de pâtures, quasi sans haies ni forêt.
    pannonian:
      palette:
        grassland: "#8a9440"
        grassland_dry: "#a89a4c"
        farmland: "#b49c48"
        farmland_dry: "#c0a458"
      forest_keep: 0.4
      presence: 1.1
      pasture_shift: 0.0
      bocage: 0.05
      openfield: 1.5
      vine: 0.6
    # Forêt mixte épicéa-bouleau-chêne, clairières et lacs, champs de seigle.
    hemiboreal:
      palette:
        grassland: "#5f843a"
        grassland_dry: "#7a8c4a"
        farmland: "#8a8c44"
        forest_broadleaf: "#2c4a24"
        forest_conifer: "#1c3622"
      conifer_min: 0.5
      presence: 0.55
      pasture_shift: 0.1
      bocage: 0.3
      openfield: 0.6
      vine: 0.0
    # Maquis, oliveraies, terrasses et sol rocheux ocre.
    aegean_maquis:
      palette:
        grassland: "#8a8a48"
        grassland_dry: "#aa9a58"
        farmland: "#b08850"
        farmland_dry: "#c0925c"
        forest_broadleaf: "#4a5a34"
        forest_conifer: "#3a4e2c"
        heath: "#8a7a50"
        scrub: "#5c6a3c"
        scrub_light: "#8e8e5e"
      dry_max: 0.4
      forest_keep: 0.3
      scrub: 0.8
      presence: 0.65
      pasture_shift: -0.3
      bocage: 0.05
      openfield: 0.2
      vine: 1.6
      crops:
        - {name: olivier, color: "#7a8260", weight: 0.4}
        - {name: ble, color: "#c9a24a", weight: 0.2}
        - {name: vigne, color: "#6a6634", weight: 0.15}
        - {name: jachere, color: "#b0794d", weight: 0.15}
        - {name: labour, color: "#b0704a", weight: 0.1}

# Classes régionales (VIS-R3a) : un pays qui se lit de loin, au-dessus des biomes. Chaque classe prend la
# place des biomes là où son masque est plein (fondu sur `transition_km`) ; `base` = classe de biome dont
# elle hérite, le reste surcharge (mêmes clés que `biomes.classes`). Où : `landscape` (id de
# data/map/agri_landscapes.json, masque cuit data/map/agri_regions.png), `regions` (ids des régions de
# agri_landscapes.json) et `ellipses` (lon / lat, comme wetlands.json).
regional:
  # Bocage de l'ouest (Bretagne, Normandie, Maine, Gâtine, Devon, Galice...) : petits prés verts
  # sombres bordés de haies, labours rares, vergers.
  bocage:
    base: oceanic
    landscape: bocage_west
    transition_km: 14.0
    palette:
      grassland: "#4b7a30"
      grassland_dry: "#6f8c3a"
      farmland: "#7d8a45"
      forest_broadleaf: "#243a1a"
    presence: 1.25
    pasture_shift: 0.35
    bocage: 3.0
    openfield: 0.0
    vine: 0.1
    crops:
      - {name: seigle_avoine, color: "#968c52", weight: 0.2}
      - {name: orge, color: "#a39656", weight: 0.14}
      - {name: jachere, color: "#977852", weight: 0.14}
      - {name: labour, color: "#a07c57", weight: 0.16}
      - {name: pre, color: "#4f7a30", weight: 0.36}
    pastures:
      - {name: pre, color: "#47792f", weight: 0.5}
      - {name: pature, color: "#58823a", weight: 0.3}
      - {name: pre_fauche, color: "#6b8e40", weight: 0.2}
  # Beauce et grandes plaines à blé du Bassin parisien : openfield clair, jaune paille, craie.
  beauce:
