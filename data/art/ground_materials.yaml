# HB2 (ADR 0143): ground materials of the campaign map, generated by fal.ai as nadir
# aerial orthophotos, made seamless by tools/cent_ans_tools/ground_materials.py, their mean
# luminance equalised (the colour map gives the hue), normal + roughness derived from the
# luminance, then packed into two Texture2DArray images
# (game/assets/textures/terrain/hb_ground_albedo_array.jpg / hb_ground_normal_array.jpg,
# grid of `layer_size`² slices). `layer` = index in the arrays (0..n-1, contiguous).
# Biome indices (ADR 0143, data/map/biomes.yaml): 1 oceanic, 2 continental,
# 3 mediterranean, 4 steppe, 5 boreal, 6 mountain/alpine, 7 semi-arid.
# role: crop (fields, meadows, vines, orchards), canopy (forest seen from above),
# ground (rock, scree, heath, steppe, bog). tile_m = metres of terrain covered by one tile.
# Prompt sent = style_prefix + format(scale_sentence, tile_m) + prompt + style_suffix.
# Realism first (player 30/09): Greek garrigue = sparse low shrubs on pale stony limestone;
# Russian steppe = golden waving grass without trees.
model: fal-ai/flux-2-pro
size: 1024
layer_size: 1024
blend_width: 96
# Mean linear luminance every albedo is brought to (the shader tints with the colour map).
target_luminance: 0.18
style_prefix: >-
  Seamless tileable texture. Vertical nadir aerial orthophoto taken straight down from
  directly above, like a satellite or drone orthomosaic: strictly top-down, no perspective,
  no horizon, no sky, flat ground filling the whole frame edge to edge. Soft diffuse
  overcast daylight, no strong directional cast shadows. Photorealistic, natural colours,
  high detail, uniform coverage without a dominant central feature.
scale_sentence: "The image covers about {tile_m} metres of ground on each side."
style_suffix: >-
  No roads, no paths, no buildings, no people, no animals, no water, no text, no border, no vignette, no lens distortion.
materials:
