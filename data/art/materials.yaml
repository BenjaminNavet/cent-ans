# GA1: tileable materials of the fine battle figures (ADR 0104), SR1: 8 of them now
# CC0 PBR scans from ambientCG (``source: ambientcg:<AssetId>``, 1K-JPG maps Color,
# NormalGL, Roughness, Displacement; normal taken from the scan, not derived).
# Order = layer of fine_detail_ga1.png / fine_detail_albedo.png (GA1_TILE_* in
# battle_soldier_skinned.gdshader); tile_m must equal GA1_TILE_SIZE there (pytest).
# Scans: scan_m = physical side given to the whole 1K scan (ambientCG dimensionX when
# plausible, else estimated from the pattern period measured by autocorrelation/FFT of
# the Displacement map, 1024 px). tile_m = scan_m everywhere: the whole scan is already
# seamless, while a crop of a periodic weave or mail would need a phase-mismatched blend
# (ghosted seams); 1024 -> 512 px keeps >= 4 px per thread and 8 px per ring. A smaller
# tile_m would crop around crop_centre and blend it tileable (blend_width, output px).
# Generated prompts (kept layers skin, hair, coat_*): flat texture seen straight on, even
# diffuse light, no cast shadow or perspective, filling the frame (the pipeline makes it
# tileable afterwards). Their tiles are NOT regenerated: build_fine_arrays copies their
# layers from the committed arrays when no tile is supplied.
model: openai/gpt-5-image-mini  # generated layers only
size: 1024
tile_size: 512
materials:
  - id: wool
    # Fabric045 (no size metadata): knitted/fulled yarn columns, period 13.5 px ->
    # 76 columns per scan; hand-spun fulled wool yarn ~2 mm -> 0.15 m.
    source: ambientcg:Fabric045
    scan_m: 0.15
    tile_m: 0.15
    normal_strength: 1.0
    roughness_bias: 0.3  # scan 0.53 -> ~0.83, wool is matte
    detail_saturation: 0.2
  - id: linen
    # Fabric061 (metadata 40 cm = 3 mm threads, upholstery canvas): plain weave repeat
    # 16 px = 2 threads -> 128 threads per scan; medieval linen thread ~1 mm -> 0.13 m.
    source: ambientcg:Fabric061
    scan_m: 0.13
    tile_m: 0.13
    normal_strength: 1.5
    roughness_bias: 0.0  # scan 0.84
    detail_saturation: 0.2
  - id: fustian
    # Fabric066 (metadata 40 cm = 1.6 mm threads): repeat 8 px = 2 threads -> 256
    # threads per scan; dense fustian twill thread ~0.6 mm -> 0.16 m.
    source: ambientcg:Fabric066
    scan_m: 0.16
    tile_m: 0.16
    normal_strength: 1.5
    roughness_bias: 0.0  # scan 0.82
    detail_saturation: 0.15
  - id: gambeson
    # Fabric048 (metadata 40 cm): quilted grid, period 128 px -> 8 squares of 5 cm;
    # scaled x0.8 so the quilting reads as 4 cm channels (gambeson 3-4 cm) -> 0.32 m.
    source: ambientcg:Fabric048
    scan_m: 0.32
    tile_m: 0.32
    normal_strength: 1.5
    roughness_bias: 0.3  # scan 0.53 -> ~0.83, padded linen is matte
    detail_saturation: 0.2
  - id: mail
    # Chainmail002 (no size metadata): 4-in-1 rows, horizontal ring pitch 16 px (FFT
    # peak 64 cycles per scan); 9 mm rings overlap to an ~8 mm pitch -> 64 x 8 mm =
    # 0.51 m (8 px per ring on the 512 px tile).
    source: ambientcg:Chainmail002
    scan_m: 0.51
    tile_m: 0.51
    normal_strength: 1.0
    roughness_bias: 0.0  # scan 0.40 (rings ~0.3, gaps rougher)
    detail_saturation: 0.0
  - id: leather
    # Leather033A (metadata 30 cm, grain and creases consistent with it) -> 0.3 m.
    source: ambientcg:Leather033A
    scan_m: 0.3
    tile_m: 0.3
    normal_strength: 3.0  # scan normal very flat (|xy| 0.04)
    roughness_bias: 0.1  # scan 0.47 -> ~0.57, waxed leather
    detail_saturation: 0.25
  - id: plate
    # Metal055A (no size metadata): streaks and stains 20-80 px wide, read as file
    # marks and 1-2 cm hammer blotches on a breastplate -> 0.3 m.
    source: ambientcg:Metal055A
    scan_m: 0.3
    tile_m: 0.3
    normal_strength: 4.0  # scan normal almost flat (|xy| 0.01): faint dents only
    roughness_bias: 0.1  # scan 0.27 -> ~0.37 (GA1 had 0.38); metallic from shader codes
    detail_saturation: 0.0
  - id: wood
    # Wood049 (metadata 80 cm): plank-scale grain, lines ~3 cm apart -> 0.8 m.
    source: ambientcg:Wood049
    scan_m: 0.8
    tile_m: 0.8
    normal_strength: 1.5
    roughness_bias: 0.25  # scan 0.50 -> ~0.75, weathered unfinished wood
    detail_saturation: 0.3
  - id: skin
    prompt: >-
      Seamless flat texture swatch of human skin seen very close, light European
      complexion, fine pores, faint fine wrinkles and subtle uneven redness, no hair,
      no moles. Photographed straight on, orthographic view, perfectly even diffuse
      lighting, no cast shadows, no highlights, no perspective, no vignette, the skin
      fills the entire frame edge to edge. No text, no border, no objects.
    tile_m: 0.06
    blend_width: 128
    height_strength: 0.35
    roughness_bias: -0.15
    detail_saturation: 0.1
  - id: hair
    prompt: >-
      Seamless flat texture swatch of straight human hair strands running vertically,
      medium brown, many fine strands with slight waves and lighter and darker locks,
      no scalp showing. Photographed straight on, orthographic view, perfectly even
      diffuse lighting, no cast shadows, no perspective, no vignette, the hair fills
      the entire frame edge to edge. No text, no border, no face, no objects.
    tile_m: 0.05
    blend_width: 96
    height_strength: 0.8
    roughness_bias: -0.1
    detail_saturation: 0.0
  - id: coat_light
    prompt: >-
      Seamless flat texture swatch of the short glossy coat of a light grey horse,
      fine hairs lying in one direction running vertically, subtle dapples, even
      colour. Photographed straight on, orthographic view, perfectly even diffuse
      lighting, no cast shadows, no highlights, no perspective, no vignette, the coat
      fills the entire frame edge to edge. No text, no border, no objects.
    tile_m: 0.1
    blend_width: 128
    height_strength: 0.4
    roughness_bias: -0.1
    detail_saturation: 0.1
  - id: coat_dark
    prompt: >-
      Seamless flat texture swatch of the short glossy coat of a dark bay horse,
      fine hairs lying in one direction running vertically, deep reddish brown, even
      colour. Photographed straight on, orthographic view, perfectly even diffuse
      lighting, no cast shadows, no highlights, no perspective, no vignette, the coat
      fills the entire frame edge to edge. No text, no border, no objects.
    tile_m: 0.1
    blend_width: 128
    height_strength: 0.4
    roughness_bias: -0.1
    detail_saturation: 0.1
