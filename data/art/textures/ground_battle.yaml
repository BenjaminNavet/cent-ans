# TX 2c (spec docs/superpowers/specs/2026-10-09-textures-regionales-design.md § 2c): battle
# ground, close-up (one tile = a few metres). 13 roles (current materials: data/fx/battle_ground_layers.json)
# x 14 biomes (see ground_campaign.yaml for the biome list). One entry per (role, biome group): the
# `biomes` list shares an entry between biomes whose look is the same, so every biome appears
# exactly once per role (checked by tools/tests/test_texture_catalogs_ground.py). Seeds: 5000 + index * 10.
family: ground_battle
backend: fal
size: 2048
output_size: 2048
style_prefix: >-
  Close-up top-down view of the ground, camera pointing straight down from about one metre, ground filling
  the whole frame edge to edge, seamless and tileable, uniform coverage without a dominant central feature.
  Flat diffuse overcast light, no cast shadows, natural colours, photorealistic, sharp fine detail. The
  image covers about {tile_m} metres of ground on each side.
style_suffix: >-
  No horizon, no sky, no people, no animals, no objects, no buildings, no water, no text, no border, no
  frame, no vignette.
