# TX water (09/10, budget raised by the player to 3 $): top-down water surfaces per biome; the
# pack pass derives a normal from the ripple pattern, the shader keeps the procedural flow.
# Cost: 12 x 2048 px x 0.021 $ ~ 0.25 $.
family: water_surfaces
backend: fal
size: 2048
output_size: 2048
style_prefix: Photorealistic aerial photograph, soft diffuse overcast lighting, natural colours, high
  detail.
style_suffix: Seamless tileable texture, sharp fine detail across the whole image, realistic colours.
entries:
- id: water_sea_atlantic
  role: sea
  biomes:
  - 1
  - 2
  - 11
  prompt: Top-down view of the surface of a grey-green Atlantic coastal sea with small choppy wind waves,
    ripples evenly spread over the whole frame.
  seed: 10000
  tile_m: 40
  checks: &id001
    luminance:
    - 0.05
    - 0.85
    saturation:
    - 0.0
    - 0.8
    seam_max: 0.08
