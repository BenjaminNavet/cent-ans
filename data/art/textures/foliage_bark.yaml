# TX 3b (spec docs/superpowers/specs/2026-10-09-textures-regionales-design.md § 3): tree bark
# (tileable, front view) and leaf/needle sheets (alpha) for 12 species, 2 roles each. `species`
# = id in data/art/tree_species.yaml (absent for date palm: not a species of the game yet).
# Biomes = where the species grows (see ground_campaign.yaml). Seeds: 8000 + index * 10.
# Cost: 24 x 2048 px x 0.021 $ ~ 0.50 $.
family: foliage_bark
backend: fal
size: 2048
output_size: 2048
style_prefix: >-
  Photorealistic photograph, soft diffuse overcast lighting, natural colours, high detail.
style_suffix: >-
  Sharp fine detail across the whole image, natural lighting, realistic colours.
processing:
  blend_width: 128
  feather: 8.0
  equalize: false  # le bouleau reste clair, le chêne sombre
  height_strength: 3.0
  roughness: 0.9
# Écorces raccordables 1024 (normales 512) et planches de feuilles détourées 1024 (RGBA) ; chaque
# couche garde son `species` (id de data/art/tree_species.yaml) pour `data/art/tree_textures.json`.
packs:
  - name: bark
    roles: [bark]
    texture_dir: assets/textures/vegetation/
    hi_dir: hi/
    albedo: tx_bark_albedo_array.jpg
    normal: tx_bark_normal_array.jpg
    manifest: data/art/tx_bark_pack.json
    layer_size: 1024
    normal_size: 512
    strip_prefix: ""
  - name: leaves
    kind: sheet
    roles: [leaves]
    texture_dir: assets/textures/vegetation/
    albedo: tx_leaves_array.webp
    manifest: data/art/tx_leaves_pack.json
    layer_size: 1024
entries:
- id: oak_bark
  role: bark
  species: oak
  biomes: [1, 2, 10, 11, 12]
  prompt: >-
    Flat front view of deeply furrowed grey-brown oak bark with thick vertical ridges, the bark surface filling the whole frame edge to edge, seamless and tileable, evenly lit, uniform coverage.
  seed: 8000
  tile_m: 1
  checks:
    luminance: [0.08, 0.85]
    saturation: [0.0, 0.75]
    seam_max: 0.08
