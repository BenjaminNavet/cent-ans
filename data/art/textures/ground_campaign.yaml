# TX 2b (spec docs/superpowers/specs/2026-10-09-textures-regionales-design.md § 2b): campaign
# ground. Background layers = 3 roles per biome (grass_bare, understory, rock) + shared layers
# (snow, sand, scree); parcel materials = the 27 HB2 materials of ground_materials.yaml (ids
# prefixed parcel_) + 15 new ones. Biomes: 1 oceanic north, 2 continental west, 3 humid
# Mediterranean, 4 steppe, 5 boreal taiga, 6 mountain/alpine, 7 semi-arid, 8 desert, 9 tundra/
# arctic, 10 eastern continental forest-steppe, 11 Atlantic south, 12 Pannonian-Danubian,
# 13 hemiboreal mixed forest, 14 dry Mediterranean/Aegean maquis.
# Prompt sent = style_prefix ({tile_m} substituted) + prompt + style_suffix. Seeds: 1000 + index * 10.
family: ground_campaign
backend: fal
size: 2048
output_size: 2048
style_prefix: >-
  Vertical nadir aerial orthophoto taken straight down from directly above, like a satellite or drone
  orthomosaic, the camera pointing exactly straight down at flat ground, the ground filling the whole frame
  edge to edge, seamless and tileable, uniform coverage without a dominant central feature. Flat diffuse overcast
  daylight, soft even lighting, natural colours, photorealistic, high detail. The image covers about {tile_m}
  metres of ground on each side.
style_suffix: >-
  The same continuous, unbroken ground everywhere, rich fine-grained natural detail and gentle variation of
  colour at every scale, as untouched medieval countryside. Only ground and plants, nothing written, nothing
  framed.
