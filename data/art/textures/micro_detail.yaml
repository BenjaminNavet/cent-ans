# TX micro-detail (spec § 1): fine grain textures blended near the camera by the ground, bark and
# masonry shaders. Cost: 16 x 2048 px x 0.021 $ ~ 0.34 $.
family: micro_detail
backend: fal
size: 2048
output_size: 2048
style_prefix: Photorealistic macro photograph, soft diffuse lighting, natural colours, high detail.
style_suffix: Seamless tileable texture, sharp fine detail across the whole image, evenly lit.
