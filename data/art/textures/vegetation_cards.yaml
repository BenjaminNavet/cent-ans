# TX 3a (spec docs/superpowers/specs/2026-10-09-textures-regionales-design.md § 3): ground
# vegetation cards, one isolated plant per image, extracted by the alpha step (rembg). 5 cards per
# biome (1-14, see ground_campaign.yaml) + battle grass: roles grass_blades / grass_tufts / grass_clump
# x 5 groups (green: biomes 1,2,10,11,12,13; dry: 3,7,14; steppe: 4,8; alpine: 6; arctic: 5,9).
# `tile_m` = real height/width of the plant in metres. Prompts are positive-only (Z-Image has no
# negative prompt). Seeds: 7000 + index * 10. Cost: 85 x 1024 px x 0.005 $ ~ 0.43 $.
family: vegetation_cards
backend: fal
size: 1024
output_size: 2048
upscale: native
style_prefix: >-
  Photorealistic botanical photograph of a single plant, seen from the side, the whole plant complete
  and centred in the frame, surrounded by a wide margin of plain uniform light neutral grey background,
  soft diffuse even lighting. The plant is about {tile_m} metres across.
style_suffix: >-
  The plant stands alone on a flat plain light grey backdrop, fully inside the frame with empty grey
  space on every side, crisp detail on every leaf and stem, natural colours.
# Cartes détourées (`cent-ans textures alpha vegetation_cards`, rembg) puis `textures pack` :
# cartes au sol de campagne en un tableau RGBA 1024 ; herbe de bataille en un fichier WebP par carte.
packs:
  - name: ground_cards
    kind: cards
    roles: [ground_card]
    texture_dir: assets/textures/vegetation/
    albedo: tx_ground_cards_array.webp
    manifest: data/art/tx_ground_cards_pack.json
    layer_size: 1024
  - name: battle_grass
    kind: files
    roles: [grass_blades, grass_tufts, grass_clump]
    texture_dir: assets/textures/battle/grass/
    manifest: data/art/tx_battle_grass_pack.json
    layer_size: 1024
