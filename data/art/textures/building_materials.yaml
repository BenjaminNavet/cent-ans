# TX tranche 4 (spec docs/superpowers/specs/2026-10-09-textures-regionales-design.md section 4):
# regional building materials. Each entry is one regional variant of an existing role of
# data/art/building_materials.json (Plaster, Rubble, Ashlar, Masonry, Timber, Planks, TimberFrame,
# RoofTile, RoofFlat, RoofSlate, Thatch); `regions` are ids of data/art/building_regions.json.
# Every region is covered for each of these roles. Bricks live under Masonry, wooden shingles
# (bardeaux) under RoofSlate, turf and heather under Thatch, earth terraces under RoofFlat.
# Prompt sent = style_prefix ({tile_m} substituted) + prompt + style_suffix. Seeds: 9000 + index * 10.
family: building_materials
backend: fal
size: 1536  # 1536 : tient dans l’enveloppe TX (normales et rugosité en 1k)
output_size: 2048
style_prefix: >-
  Front view of a surface seen exactly face-on, the camera straight in front of a perfectly flat
  wall or roof, the material filling the whole frame edge to edge, seamless and tileable, uniform
  coverage without a dominant central feature. Soft diffuse daylight, even lighting, natural
  colours, photorealistic, high detail, medieval building material. The image covers about {tile_m}
  metres on each side.
style_suffix: >-
  The same continuous, unbroken surface everywhere, rich fine detail and gentle variation of colour
  at every scale, aged by centuries of weather. Only the material itself, flat and evenly lit.
entries:
