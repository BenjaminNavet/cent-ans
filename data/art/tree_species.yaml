# HB4 : essences d'arbres et d'arbustes de la carte de campagne (ADR 0143), et leur répartition
# par biome (indices figés de data/map/biomes.png : 1 océanique, 2 continental,
# 3 méditerranéen, 4 steppe, 5 boréal, 6 montagnard/alpin, 7 semi-aride ; 0 = mer).
# Validé par data/schemas/art_tree_species.schema.json.
#
# Source unique : les imposteurs sont générés par
#   uv run --with fal-client python tools/blender_scripts/ga3_vegetation_l2.py fal
#   uv run --project tools python tools/blender_scripts/ga3_vegetation_l2.py atlas
# (une ligne de l'atlas GA3 par essence, dans l'ordre de `species`, les trois premières
# inchangées : chêne, hêtre, sapin) ; la même commande `atlas` compile ce fichier en
# data/art/tree_species.json, lu par le jeu (Godot ne lit pas le YAML). Rendu seulement.
#
# Rôles d'un arbre (tirés par le semis) :
#   massif    cœur des forêts (couverture forestière >= distribution.massif_core)
#   lisiere   bord des forêts
#   isole     arbres des champs, des haies et bosquets
#   verger    vergers autour des villages et oliveraies
#   ripisylve bords des fleuves et rivières
#   garrigue  broussailles de la lande sèche (maquis ouvert, steppe)
# Poids d'une essence = biomes[b] × roles[r] × fenêtre d'altitude × (1 + river × proximité
# du fleuve) × part de résineux (forest_kind.png, lot R1) ; tirage par peuplements
# (cellules de distribution.stand_px) pour des taches d'une même essence.

distribution:
  massif_core: 0.6           # couverture forestière au-delà de laquelle on est « au cœur »
  massif_fill: 0.95          # part des candidats plantés au cœur (canopée continue)
  edge_fill: 0.8             # part des candidats plantés en lisière (× couverture)
  stand_px: 3.0              # côté (px carte) d'un peuplement d'une même essence
  stand_share: 0.7           # part des arbres qui suivent l'essence de leur peuplement
  altitude_fade_m: 150.0     # fondu des poids hors de la plage d'altitude d'une essence
  river_reach_px: 3.0        # portée (px) de l'affinité aux fleuves (proximité 1 → 0)
  conifer_raster: 0.6        # poids de forest_kind.png dans le choix résineux / feuillus
  orchard_parcel_px: 2.2     # côté d'une parcelle de verger
  orchard_fill: 0.75         # part des candidats plantés dans une parcelle de verger
  hedge_boost: 3.0           # arbres isolés : × (1 + hedge_boost × densité de haies)
  grove_core: 0.55           # bosquets : seul le cœur des taches de bruit (denses, rares)
  hedge_tree: 0.025          # part des pieds de haie qui sont des arbres (V4 : 0,07)
  village_boost: 4.0         # arbres isolés : × (1 + village_boost) près des villages
  default_biome: 2           # repli sans data/map/biomes.png

# Paramètres de semis par biome (probabilités par candidat, grille ~1,35 px).
#   forest      facteur de la couverture forestière (steppe : presque nue)
#   isolated    arbres isolés dans les champs (avant bonus haies / villages)
#   grove       remplissage des bosquets (cœur des taches de bruit × grove)
#   orchard     parcelles de verger dans l'anneau autour des villages
#   orchard_ring_px  largeur de cet anneau au-delà de la clairière du village
#   orchard_open     parcelles de verger sur toute terre cultivée (oliveraies)
#   riparian    arbres de ripisylve le long des fleuves ; riparian_px : largeur de la bande
#   scrub       broussailles de garrigue sur la terre non cultivée
biomes:
  "1": {name: oceanic, forest: 1.0, isolated: 0.002, grove: 0.8, orchard: 0.4, orchard_ring_px: 5.0, orchard_open: 0.0, riparian: 0.45, riparian_px: 1.5, scrub: 0.0}
  "2": {name: continental, forest: 1.0, isolated: 0.0015, grove: 0.8, orchard: 0.3, orchard_ring_px: 4.5, orchard_open: 0.0, riparian: 0.45, riparian_px: 1.5, scrub: 0.0}
  "3": {name: mediterranean, forest: 0.85, isolated: 0.0015, grove: 0.3, orchard: 0.45, orchard_ring_px: 6.0, orchard_open: 0.07, riparian: 0.35, riparian_px: 1.0, scrub: 0.06}
  "4": {name: steppe, forest: 0.12, isolated: 0.0002, grove: 0.08, orchard: 0.04, orchard_ring_px: 3.0, orchard_open: 0.0, riparian: 0.3, riparian_px: 1.2, scrub: 0.004}
  "5": {name: boreal, forest: 1.0, isolated: 0.002, grove: 0.85, orchard: 0.0, orchard_ring_px: 0.0, orchard_open: 0.0, riparian: 0.35, riparian_px: 1.5, scrub: 0.0}
  "6": {name: mountain, forest: 1.0, isolated: 0.0015, grove: 0.6, orchard: 0.1, orchard_ring_px: 3.0, orchard_open: 0.0, riparian: 0.3, riparian_px: 1.0, scrub: 0.01}
  "7": {name: semi_arid, forest: 0.35, isolated: 0.0005, grove: 0.12, orchard: 0.3, orchard_ring_px: 5.0, orchard_open: 0.03, riparian: 0.3, riparian_px: 1.0, scrub: 0.035}

# Teintes saisonnières (foliage_common.gdshaderinc) : oak (roux-olive), beech (cuivré),
# golden (jaune d'or : bouleau, érable, peuplier, mélèze), evergreen (persistant, poudré de
# neige en hiver). `mesh` : maillage et ligne de repli sans atlas GA3 (oak, beech, conifer) ;
# `frame` : ligne FC2 dont l'essence reprend le cadrage ; `tone` : luminance relative à la
# moyenne GA3 de sa famille (feuillus : chêne, résineux : sapin). Tailles en unités de carte.
species:
  - id: oak
    name: Chêne pédonculé
    latin: Quercus robur
    mesh: oak
    frame: oak
    season: oak
    biomes: {"1": 1.0, "2": 1.0, "6": 0.3}
    altitude_m: [0, 900]
    river: 0.0
    roles: {massif: 1.0, lisiere: 0.8, isole: 1.2}
    height: [1.1, 1.7]
    width: [0.95, 1.25]
    tone: 1.0
    prompt: >-
      a single mature pedunculate oak tree (Quercus robur) standing alone, short thick gnarled
      trunk, broad irregular domed crown of dense summer foliage with visible leaf clumps and a
      few sky gaps
