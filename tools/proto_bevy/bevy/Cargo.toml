[package]
name = "proto-bevy"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace: kept out of core/ (separate build and target/).
[workspace]

[dependencies]
bevy = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
