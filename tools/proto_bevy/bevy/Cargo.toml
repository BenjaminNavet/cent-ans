[package]
name = "proto-bevy"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace: kept out of core/ (separate build and target/).
[workspace]

[features]
# Opt-in: dynamic linking of Bevy for fast incremental rebuilds (compile-time criterion).
dev-fast = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "=0.20.0", features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
