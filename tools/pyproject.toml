[project]
name = "cent-ans-tools"
version = "0.1.0"
description = "Outils Python du projet Cent Ans : budget, génération d'images, scripts Blender"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "typer>=0.27.2",
]

[project.scripts]
cent-ans = "cent_ans_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cent_ans_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E","F","UP","B","SIM","I","D"]
ignore = ["E501","SIM103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
exclude = [".venv","__pycache__","*.pyc",".DS_Store",".vscode","*.egg-info","dist","build"]
