<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Éditeur de carte — Cent Ans</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #efe6d0; --ink: #3a2a1a; --line: #b9a57f; --panel: #f6efdd; --accent: #8a3b12;
    --ok: #2f6b2f; --bad: #a12626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  button, select, input { font: inherit; color: inherit; }
  button { background: #fbf6e8; border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  button:hover:not(:disabled) { background: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.tool.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.danger { color: var(--bad); }
  kbd { font: 11px ui-monospace, monospace; background: #fff8; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  main { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #cfc4a8; }
  canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside { overflow: auto; padding: 8px 10px; background: var(--panel); border-left: 1px solid var(--line); }
  aside h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  aside h3:first-child { margin-top: 0; }
  label.row { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin: 3px 0; }
  label.chk { display: block; margin: 2px 0; }
  input[type=number], input[type=text], select { width: 100%; padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; background: #fffdf6; }
  #msg { padding: 5px 10px; font-size: 12px; border-top: 1px solid var(--line); background: var(--panel); min-height: 26px; }
  #msg.err { background: #f4d6d0; color: var(--bad); white-space: pre-line; }
  #msg.ok { color: var(--ok); }
  #log { background: #20190f; color: #e9dcc0; font: 11px/1.3 ui-monospace, monospace; padding: 6px; height: 150px;
    overflow: auto; white-space: pre-wrap; border-radius: 4px; display: none; }
  #hud { position: absolute; left: 8px; bottom: 8px; background: #fffdf6cc; border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 6px; font: 11px ui-monospace, monospace; pointer-events: none; }
  .dirty { color: var(--bad); font-weight: 600; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .hint { color: #6b5a3f; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="tool" data-tool="edit" title="V">Crêtes <kbd>V</kbd></button>
    <button class="tool" data-tool="new" title="N">Nouvelle crête <kbd>N</kbd></button>
    <button class="tool" data-tool="pass" title="C">Cols <kbd>C</kbd></button>
    <button class="tool" data-tool="pin" title="P">Épingles <kbd>P</kbd></button>
    <button class="tool" data-tool="place" title="L">Lieux <kbd>L</kbd></button>
    <button class="tool" data-tool="brush" title="B">Pinceau <kbd>B</kbd></button>
    <span class="sep"></span>
    <button id="undo" title="Ctrl+Z">Annuler</button>
    <button id="redo" title="Ctrl+Maj+Z">Rétablir</button>
    <span class="sep"></span>
    <button id="save" class="primary" title="Ctrl+S">Enregistrer</button>
    <span id="dirty"></span>
    <span class="sep"></span>
    <button id="preview" title="Relief de la zone visible avec les retouches non enregistrées">Planche</button>
    <button id="recompile" title="geo compose + compose-relief + compose paint + compose-layers landcover,colormap">Recompiler la carte</button>
    <span style="flex:1"></span>
    <button id="help">Aide</button>
  </header>
  <main>
    <div id="stage"><canvas id="view"></canvas><div id="hud"></div></div>
    <aside>
      <h3>Sélection</h3>
      <div id="props"><span class="hint">Rien de sélectionné.</span></div>
      <h3>Calques</h3>
      <label class="chk"><input type="checkbox" data-layer="coast" checked> Côtes</label>
      <label class="chk"><input type="checkbox" data-layer="rivers" checked> Fleuves</label>
      <label class="chk"><input type="checkbox" data-layer="places" checked> Lieux (noms au zoom)</label>
      <label class="chk"><input type="checkbox" data-layer="ridges" checked> Crêtes</label>
      <label class="chk"><input type="checkbox" data-layer="passes" checked> Cols</label>
      <label class="chk"><input type="checkbox" data-layer="pins" checked> Épingles</label>
      <label class="chk"><input type="checkbox" data-layer="masks" checked> Masques peints</label>
      <label class="chk"><input type="checkbox" data-layer="cover"> Couverture calculée (couche du pinceau)</label>
      <label class="chk"><input type="checkbox" data-layer="patch" checked> Aperçu « Planche »</label>
      <div id="brushbox" style="display:none">
        <h3>Pinceau de masques</h3>
        <div id="maskpick"></div>
        <label class="row">Taille (cases) <input id="brushsize" type="range" min="1" max="24" value="4"></label>
        <div class="hint">Clic = ajouter, <kbd>Maj</kbd> = effacer, <kbd>[</kbd> <kbd>]</kbd> = taille. 1 case = 16 px de carte (≈ 11,5 km).</div>
      </div>
      <h3>Recompilation</h3>
      <div id="jobstate" class="hint">Aucune tâche.</div>
      <pre id="log"></pre>
    </aside>
  </main>
  <div id="msg"></div>
</div>
<script>
"use strict";
const GUARD = {"X-Cent-Ans-Editor": "1"};
const $ = (s) => document.querySelector(s);
const MASKS = {
  forest: {label: "Forêt", color: [44, 120, 52]},
  rock: {label: "Roche", color: [120, 110, 100]},
  fields: {label: "Champs", color: [214, 184, 70]},
  marsh: {label: "Marais", color: [60, 140, 160]},
};

let S = null;                       // état serveur
const D = {ridges: null, pins: null, nudges: null};   // documents de travail
const savedJson = {};               // dernier JSON enregistré par couche
const maskCanvas = {}, maskImg = {}, maskSaved = {};
let pinFrom = {};                   // id d'épingle -> position composée actuelle de la source
let bgImg = new Image(), patch = null;
const view = {x: 0, y: 0, k: 0.2};  // x, y : point de carte en haut à gauche ; k : px écran par px carte
const layerOn = {coast: true, rivers: true, places: true, ridges: true, passes: true, pins: true, masks: true, patch: true, cover: false};
const coverCanvas = {};          // couverture calculée (calque sous le pinceau), par couche
let tool = "edit", sel = null, draft = null, pinDraft = null, brushMask = "forest";
let undoStack = [], redoStack = [];
let drag = null, spaceDown = false, mouse = {x: 0, y: 0};
let needDraw = true, jobTimer = null;
const cv = $("#view"), ctx = cv.getContext("2d");

// ---------------------------------------------------------------- utilitaires
function msg(text, kind) { const m = $("#msg"); m.textContent = text || ""; m.className = kind || ""; }
async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  if (ct.includes("json")) {
    const j = await r.json();
    if (!r.ok) { const e = new Error((j.errors || ["Erreur"]).join("\n")); e.errors = j.errors; throw e; }
    return j;
  }
  if (!r.ok) throw new Error("Erreur HTTP " + r.status);
  return r;
}
const post = (path, body) => api(path, {method: "POST", headers: {...GUARD, "Content-Type": "application/json"}, body: JSON.stringify(body)});
function toScreen(x, y) { return [(x - view.x) * view.k, (y - view.y) * view.k]; }
function toMap(sx, sy) { return [sx / view.k + view.x, sy / view.k + view.y]; }
function redraw() { needDraw = true; }
function nextId(prefix, existing) {
  let n = 1; const set = new Set(existing);
  while (set.has(prefix + String(n).padStart(3, "0"))) n++;
  return prefix + String(n).padStart(3, "0");
}
const clone = (o) => JSON.parse(JSON.stringify(o));
const round1 = (v) => Math.round(v * 10) / 10;
function distSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - a[0]) * dx + (py - a[1]) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
  const x = a[0] + t * dx, y = a[1] + t * dy;
  return {d: Math.hypot(px - x, py - y), x, y, t};
}
function nearestOnLine(points, x, y) {
  let best = {d: Infinity, x, y, i: 0};
  for (let i = 0; i < points.length - 1; i++) {
    const r = distSeg(x, y, points[i], points[i + 1]);
    if (r.d < best.d) best = {...r, i};
  }
  return best;
}
const ridgeById = (id) => D.ridges.ridges.find((r) => r.id === id);
const placeById = (id) => S.places.find((p) => p.id === id);
function nudgeOf(id) { return D.nudges.nudges.find((n) => n.id === id); }
function placePos(p) { const n = nudgeOf(p.id); return n ? n.target_px : [p.x, p.y]; }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

// ---------------------------------------------------------------- historique
function snapshot() {
  return {json: {ridges: JSON.stringify(D.ridges), pins: JSON.stringify(D.pins), nudges: JSON.stringify(D.nudges)},
          masks: {...maskImg}};
}
function restore(s) {
  D.ridges = JSON.parse(s.json.ridges); D.pins = JSON.parse(s.json.pins); D.nudges = JSON.parse(s.json.nudges);
  for (const n of Object.keys(MASKS)) { maskImg[n] = s.masks[n]; maskCanvas[n].getContext("2d").putImageData(s.masks[n], 0, 0); }
  sel = null; draft = null; pinDraft = null; refreshPinFrom(); renderProps(); updateDirty(); redraw();
}
function beginChange() {
  undoStack.push(snapshot()); if (undoStack.length > 80) undoStack.shift();
  redoStack = []; updateDirty();
}
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }

// ---------------------------------------------------------------- chargement
async function init() {
  S = await (await fetch("/api/state")).json();
  for (const n of ["ridges", "pins", "nudges"]) { D[n] = clone(S.layers[n]); savedJson[n] = JSON.stringify(D[n]); }
  const [mw, mh] = S.mask_size;
  for (const n of Object.keys(MASKS)) {
    const c = document.createElement("canvas"); c.width = mw; c.height = mh; maskCanvas[n] = c;
    const img = new Image();
    await new Promise((res) => { img.onload = res; img.onerror = res; img.src = `/api/masks/${n}.png?t=${Date.now()}`; });
    const tmp = document.createElement("canvas"); tmp.width = mw; tmp.height = mh;
    const t = tmp.getContext("2d"); t.drawImage(img, 0, 0);
    const src = t.getImageData(0, 0, mw, mh), out = c.getContext("2d").createImageData(mw, mh);
    const [cr, cg, cb] = MASKS[n].color;
    for (let i = 0; i < mw * mh; i++) {
      out.data[4 * i] = cr; out.data[4 * i + 1] = cg; out.data[4 * i + 2] = cb; out.data[4 * i + 3] = src.data[4 * i];
    }
    c.getContext("2d").putImageData(out, 0, 0);
    maskImg[n] = c.getContext("2d").getImageData(0, 0, mw, mh); maskSaved[n] = maskImg[n];
  }
  bgImg.onload = () => { redraw(); };
  bgImg.src = `${S.background.url}?v=${S.background.version}`;
  await refreshPinFrom();
  buildMaskPicker(); fitView(); setTool("edit"); updateDirty();
  if (S.job && S.job.state === "running") pollJob();
  msg(`${D.ridges.ridges.length} crêtes, ${D.pins.pins.length} épingles, ${S.places.length} lieux.`);
  loop();
}
async function refreshPinFrom() {
  pinFrom = {};
  if (!D.pins.pins.length) return;
  try {
    const out = await post("/api/forward", D.pins.pins.map((p) => p.lonlat));
    D.pins.pins.forEach((p, i) => { pinFrom[p.id] = out[i]; });
  } catch (e) { /* flèche sans origine */ }
  redraw();
}
function fitView() {
  const w = cv.clientWidth || 1000, h = cv.clientHeight || 700, [W, H] = S.size_px;
  view.k = Math.min(w / W, h / H) * 0.98; view.x = -(w / view.k - W) / 2; view.y = -(h / view.k - H) / 2;
}

// ---------------------------------------------------------------- dessin
function resize() {
  const r = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * r); cv.height = Math.round(cv.clientHeight * r); redraw();
}
function loop() { if (needDraw) { needDraw = false; draw(); } requestAnimationFrame(loop); }
function draw() {
  if (!S) return;
  const r = window.devicePixelRatio || 1;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  const [W, H] = S.size_px;
  const [ox, oy] = toScreen(0, 0);
  ctx.imageSmoothingEnabled = true;
  if (bgImg.complete && bgImg.naturalWidth) ctx.drawImage(bgImg, ox, oy, W * view.k, H * view.k);
  if (patch && layerOn.patch) {
    const [x0, y0, x1, y1] = patch.window, [px, py] = toScreen(x0, y0);
    ctx.drawImage(patch.img, px, py, (x1 - x0) * view.k, (y1 - y0) * view.k);
    ctx.strokeStyle = "#a12626"; ctx.setLineDash([6, 4]); ctx.lineWidth = 1;
    ctx.strokeRect(px, py, (x1 - x0) * view.k, (y1 - y0) * view.k); ctx.setLineDash([]);
  }
  if (layerOn.cover && coverCanvas[brushMask]) {
    ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 0.5;
    const cc = coverCanvas[brushMask];
    ctx.drawImage(cc, ox, oy, cc.width * S.mask_cell_px * view.k, cc.height * S.mask_cell_px * view.k);
    ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true;
  }
  if (layerOn.masks) {
    ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 0.55;
    const cell = S.mask_cell_px;
    for (const n of Object.keys(MASKS)) ctx.drawImage(maskCanvas[n], ox, oy, maskCanvas[n].width * cell * view.k, maskCanvas[n].height * cell * view.k);
    ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true;
  }
  const line = (pts, style, w) => {
    ctx.beginPath();
    pts.forEach((p, i) => { const [x, y] = toScreen(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = style; ctx.lineWidth = w; ctx.stroke();
  };
  const vx0 = view.x - 50, vy0 = view.y - 50, vx1 = view.x + cv.clientWidth / view.k + 50, vy1 = view.y + cv.clientHeight / view.k + 50;
  const visible = (pts) => pts.some((p) => p[0] > vx0 && p[0] < vx1 && p[1] > vy0 && p[1] < vy1);
  ctx.lineJoin = "round";
  if (layerOn.coast) for (const l of S.coast) if (visible(l)) line(l, "#2a2a2a", 1);
  if (layerOn.rivers) for (const l of S.rivers) if (visible(l)) line(l, "#2f6fb8", 1.2);
  if (layerOn.ridges) {
    for (const r of D.ridges.ridges) {
      const on = sel && sel.ridge === r.id && !sel.pass;
      const col = r.kind === "massif" ? "#6b2a0e" : "#b07a2a";
      line(r.points, on ? "#ff2d2d" : col, on ? 3 : 2);
      if (on || view.k > 0.25) for (const p of r.points) {
        const [x, y] = toScreen(p[0], p[1]);
        ctx.fillStyle = on ? "#fff" : "#fff8"; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, on ? 4.5 : 3, 0, 7); ctx.fill(); ctx.stroke();
      }
      if (on && sel.vertex != null) {
        const [x, y] = toScreen(...r.points[sel.vertex]);
        ctx.strokeStyle = "#ff2d2d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.stroke();
      }
    }
  }
  if (layerOn.passes) {
    for (const r of D.ridges.ridges) for (const p of r.passes) {
      const [x, y] = toScreen(p.at[0], p.at[1]); const on = sel && sel.pass === p.id && sel.ridge === r.id;
      ctx.fillStyle = on ? "#ff2d2d" : "#fff"; ctx.strokeStyle = "#1c4f8a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 6, y); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (view.k > 0.5 && p.name) { ctx.fillStyle = "#1c4f8a"; ctx.font = "11px system-ui"; ctx.fillText(p.name, x + 8, y - 6); }
    }
  }
  if (layerOn.pins) {
    for (const p of D.pins.pins) {
      const to = toScreen(...p.target_px), from = pinFrom[p.id] ? toScreen(...pinFrom[p.id]) : null;
      const on = sel && sel.pin === p.id;
      ctx.strokeStyle = on ? "#ff2d2d" : "#7a1fa2"; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 2;
      if (from && Math.hypot(from[0] - to[0], from[1] - to[1]) > 2) {
        ctx.beginPath(); ctx.moveTo(...from); ctx.lineTo(...to); ctx.stroke();
        ctx.beginPath(); ctx.arc(from[0], from[1], 3, 0, 7); ctx.fill();
      }
      ctx.beginPath(); ctx.moveTo(to[0], to[1]); ctx.lineTo(to[0] - 5, to[1] - 14); ctx.lineTo(to[0] + 5, to[1] - 14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(to[0], to[1] - 17, 4, 0, 7); ctx.fill();
      if (on) { ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(to[0], to[1], (p.radius_km ?? 150) / 0.719 * view.k, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    }
    if (pinDraft) {
      const [x, y] = toScreen(...pinDraft.fromPx); ctx.fillStyle = "#7a1fa2";
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
      ctx.strokeStyle = "#7a1fa2"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  if (layerOn.places) {
    const names = view.k > 0.45;
    ctx.font = "11px system-ui";
    for (const p of S.places) {
      const [px, py] = placePos(p);
      if (px < vx0 || px > vx1 || py < vy0 || py > vy1) continue;
      const [x, y] = toScreen(px, py); const moved = !!nudgeOf(p.id), on = sel && sel.place === p.id;
      if (moved) { const [bx, by] = toScreen(p.x, p.y); ctx.strokeStyle = "#a12626"; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]); }
      ctx.fillStyle = on ? "#ff2d2d" : moved ? "#d06a00" : "#7a1a14"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
      const big = p.kind === "city" ? 4.5 : 3;
      ctx.beginPath(); ctx.arc(x, y, big, 0, 7); ctx.fill(); ctx.stroke();
      if (names || on) { ctx.fillStyle = "#2a1408"; ctx.strokeStyle = "#fffd"; ctx.lineWidth = 3; ctx.strokeText(p.name, x + 6, y + 4); ctx.fillText(p.name, x + 6, y + 4); }
    }
  }
  if (draft) {
    const pts = [...draft.points, toMap(mouse.x, mouse.y)];
    line(pts, "#ff2d2d", 2);
    for (const p of draft.points) { const [x, y] = toScreen(...p); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); ctx.stroke(); }
  }
  if (tool === "brush") {
    const rad = +$("#brushsize").value * S.mask_cell_px * view.k;
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, rad, 0, 7); ctx.stroke();
  }
  const [mx, my] = toMap(mouse.x, mouse.y);
  $("#hud").textContent = `x ${mx.toFixed(0)}  y ${my.toFixed(0)}  (${(mx * 0.719).toFixed(0)} / ${(my * 0.719).toFixed(0)} km)  zoom ${(view.k * 100).toFixed(0)} %`;
}

// ---------------------------------------------------------------- sélection / hit-test
const TOL = 9;
function hit(sx, sy) {
  const [mx, my] = toMap(sx, sy);
  if (layerOn.passes && (tool === "edit" || tool === "pass")) {
    for (const r of D.ridges.ridges) for (const p of r.passes) {
      const [x, y] = toScreen(...p.at); if (Math.hypot(x - sx, y - sy) < TOL) return {type: "pass", ridge: r.id, pass: p.id};
    }
  }
  if (layerOn.pins && tool === "pin") {
    for (const p of D.pins.pins) { const [x, y] = toScreen(...p.target_px); if (Math.hypot(x - sx, y - 10 - sy) < TOL + 4 || Math.hypot(x - sx, y - sy) < TOL) return {type: "pin", pin: p.id}; }
  }
  if (layerOn.places && tool === "place") {
    let best = null, bd = TOL + 2;
    for (const p of S.places) { const [x, y] = toScreen(...placePos(p)); const d = Math.hypot(x - sx, y - sy); if (d < bd) { bd = d; best = p; } }
    if (best) return {type: "place", place: best.id};
  }
  if (layerOn.ridges && (tool === "edit" || tool === "pass")) {
    for (const r of D.ridges.ridges) for (let i = 0; i < r.points.length; i++) {
      const [x, y] = toScreen(...r.points[i]); if (Math.hypot(x - sx, y - sy) < TOL) return {type: "vertex", ridge: r.id, vertex: i};
    }
    let best = null, bd = TOL;
    for (const r of D.ridges.ridges) {
      const n = nearestOnLine(r.points, mx, my); const d = n.d * view.k;

  clearTimeout(jobTimer);
  jobTimer = setTimeout(async () => {
    const j = await (await fetch("/api/job")).json();
    $("#log").style.display = "block"; $("#log").textContent = j.log.join("\n"); $("#log").scrollTop = 1e9;
    $("#jobstate").textContent = {running: `En cours : ${j.step} (${j.seconds} s)`, done: `Terminé en ${j.seconds} s.`, failed: `Échec après ${j.seconds} s (voir le journal).`, idle: "Aucune tâche."}[j.state];
    $("#recompile").disabled = j.state === "running";
    if (j.state === "running") pollJob();
    else if (j.state === "done") {
      const st = await (await fetch("/api/state")).json(); S.background = st.background; S.coast = st.coast; S.rivers = st.rivers; S.places = st.places;
      bgImg = new Image(); bgImg.onload = redraw; bgImg.src = `${S.background.url}?v=${S.background.version}`; patch = null;
      await refreshPinFrom(); msg("Carte recompilée, fond rafraîchi.", "ok"); redraw();
    } else if (j.state === "failed") msg("La recompilation a échoué.", "err");
  }, 1500);
}
window.addEventListener("resize", resize);
resize();
init().catch((e) => msg("Chargement impossible : " + e.message, "err"));
</script>
</body>
</html>
