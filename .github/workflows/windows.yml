# WIN (ADR 0087, ADR 0362, ADR 0366): proves the Bevy client builds and passes its unit tests on
# the three OSes of the players, and that the launcher plan is coherent; the Windows run also
# tests the double-click launcher "Lancer Cent Ans.exe" committed at the root (ADR 0153).
# On main, a green run then fast-forwards `stable`, the branch the players' launchers follow
# (ADR 0159): a commit that fails here never reaches them. Also manual, and on the windows/*
# branches to try a change without touching `stable`.
name: windows

on:
  workflow_dispatch:
  push:
    branches: ["main", "windows/**"]
    # Nothing to prove for the players in a documentation-only push; `stable` catches up with
    # the next one.
    paths-ignore: ["docs/**"]

# One run at a time per branch, and only the latest waiting one is kept: `stable` keeps moving
# under a burst of pushes without a run per commit.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ADR 0362: the launchers start the Bevy client by default. This job proves, on the three OSes
  # of the players, that the client builds in release exactly as `tools/launch.sh` builds it, that
  # its unit tests pass, and that the launcher plan (--dry-run) is coherent. The run of the window
  # itself (GPU needed) is only tried on Linux with a software Vulkan driver and may fail without
  # blocking. `promote` waits for it: a client that does not build never reaches `stable`.
  bevy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers xvfb

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Launcher unit tests (Windows)
        if: runner.os == 'Windows'
        working-directory: tools/launcher-windows
        run: cargo test

      - name: Launcher plan (dry run)
        shell: bash
        run: bash tools/launch.sh --dry-run

      # The launcher's own build step, as a player runs it (cargo build --release in client/).
      - name: Build the client (release)
        shell: bash
        run: cargo build --release --manifest-path client/Cargo.toml

      - name: Client unit tests
        shell: bash
        run: cargo test --release --manifest-path client/Cargo.toml --lib

      - name: Window smoke (Linux, software Vulkan, may fail)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          CENT_ANS_MUTE=1 xvfb-run -a client/target/release/cent-ans --state MainMenu --exit-after 120

  # Fast-forward only (force=false): a rewritten main fails here instead of breaking the
  # players' clones, and a re-run of an old commit cannot move `stable` backwards. The first
  # green run creates the branch.
  promote:
    needs: [bevy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward stable to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" \
              -f sha="$GITHUB_SHA" -F force=false
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/stable -f sha="$GITHUB_SHA"
          fi
