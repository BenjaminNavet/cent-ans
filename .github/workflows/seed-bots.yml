# Seed bots (ADR 0348): passe rapide des bots de test (8 bots x 1 graine x 20 tours, oracles 1-3)
# sur le coeur Rust, sans Godot. Filet de securite automatique : elle ne signale que des bogues
# francs (panique, invariant casse, ordre legal refuse, sauvegarde qui ne reboucle pas).
# Workflow separe de `windows.yml` a dessein : `windows.yml` fait avancer la branche `stable`
# suivie par les joueurs (ADR 0159) et ne doit pas dependre de cette passe. La passe longue
# (4 graines x 150 tours) n'est jamais lancee ici : seulement apres feu vert du joueur.
name: seed-bots

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**"]

concurrency:
  group: seed-bots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Quick seed-bots pass
        working-directory: core
        run: cargo run --profile seed-bots -p seed-bots -- run --quick --out seed-bots-report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-bots-report
          path: core/seed-bots-report
          if-no-files-found: warn
