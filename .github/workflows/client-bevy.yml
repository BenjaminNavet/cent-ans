# Bevy client (ADR 0357, 0362): unit / integration tests with cargo-nextest (retries and JUnit via
# client/.config/nextest.toml, profile `ci`). Linux, no GPU: the smoke scenarios (a background
# window of run_bg.sh) are not run here, only the tests that need no window.
name: client-bevy

on:
  workflow_dispatch:
  pull_request:
    paths: ["client/**", "core/**", "data/**"]

concurrency:
  group: client-bevy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bevy system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Tests (nextest, fallback cargo test)
        working-directory: client
        env:
          NEXTEST_PROFILE: ci
        run: tests/test.sh

      - name: JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: client/target/nextest/ci/junit.xml
          if-no-files-found: ignore
